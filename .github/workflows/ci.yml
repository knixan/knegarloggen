name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typkontroll, lint, test och bygge
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # Bygget validerar miljövariabler (src/lib/env.ts) – riktiga nycklar
    # behövs inte, bara värden i rätt format. Ingen databas används.
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      BETTER_AUTH_SECRET: ci-hemlighet-som-ar-minst-32-tecken-lang
      BETTER_AUTH_URL: http://localhost:3000
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: pk_test_ci
      RESEND_API_KEY: re_ci
      RESEND_FROM: CI <ci@example.com>
      STRIPE_SECRET_KEY: sk_test_ci
      STRIPE_WEBHOOK_SECRET: whsec_ci
      STRIPE_PRICE_ID: price_ci
      UPLOADTHING_TOKEN: ci
      NEXT_TELEMETRY_DISABLED: 1

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Prisma-klienten (packages/app/src/generated) ligger inte i git.
      # postinstall genererar den redan – det här steget gör det tydligt.
      - name: Generera Prisma-klienten
        run: pnpm --filter @knegarloggen/app generate

      - run: pnpm type-check
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
