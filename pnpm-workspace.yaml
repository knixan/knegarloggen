packages:
  - "apps/*"
  - "packages/*"

# Gemensamma versioner för alla appar och paket.
# Skriv "catalog:" som version i package.json och uppdatera bara här.
catalog:
  # Ramverk
  next: 16.2.9
  eslint-config-next: 16.2.9
  react: 19.2.4
  react-dom: 19.2.4
  # Auth, betalning, e-post, uppladdning
  better-auth: ^1.6.22
  stripe: ^22.3.0
  resend: ^6.16.0
  uploadthing: ^7.7.4
  "@uploadthing/react": ^7.3.3
  # Databas
  prisma: ^7.8.0
  "@prisma/client": ^7.8.0
  "@prisma/adapter-pg": ^7.8.0
  "@prisma/client-runtime-utils": 7.8.0
  pg: ^8.22.0
  # Formulär och validering
  zod: ^4.4.3
  react-hook-form: ^7.80.0
  "@hookform/resolvers": ^5.4.0
  # UI
  lucide-react: ^1.22.0
  next-themes: ^0.4.6
  sonner: ^2.0.7
  shadcn: ^4.12.0
  tw-animate-css: ^1.4.0
  tailwindcss: ^4
  "@tailwindcss/postcss": ^4
  "@react-pdf/renderer": ^4.5.1
  # Övrigt
  date-fns: ^4.4.0
  dotenv: ^17.4.2
  # Verktyg och typer
  typescript: ^5
  vitest: ^4.1.0
  eslint: ^9
  "@types/node": ^20
  "@types/pg": ^8.20.0
  "@types/react": ^19
  "@types/react-dom": ^19

allowBuilds:
  '@prisma/engines': true
  esbuild: true
  msgpackr-extract: true
  prisma: true
  sharp: true
  unrs-resolver: true

onlyBuiltDependencies:
  - "@prisma/engines"
  - "prisma"
  - "esbuild"
  - "sharp"
  - "msgpackr-extract"
  - "unrs-resolver"

# vite 8.2+ kräver lightningcss ^1.33.0, som inte finns publicerad (senaste
# är 1.32.0). Ta bort när vitest/vite går att installera utan den här låsningen.
overrides:
  vite: ~8.1.0

# @hookform/resolvers importerar zod-typer utan att deklarera zod. Utan det
# här hittar den zod 3 via hoistningen och zodResolver får fel typer.
packageExtensions:
  "@hookform/resolvers":
    peerDependencies:
      zod: "*"
